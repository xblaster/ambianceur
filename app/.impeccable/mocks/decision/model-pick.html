<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Roboto+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --black:#111; --paper:#f6f3ec; --red:#e2001a; --yellow:#ffe100; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:390px; height:844px; overflow:hidden; background:var(--paper); color:var(--black);
    font-family:"Roboto Condensed", system-ui, sans-serif; }
  body { display:flex; flex-direction:column; }
  .mast { background:var(--red); color:#fff; padding:14px 16px 10px; display:flex; justify-content:space-between; align-items:flex-end; }
  .mast h1 { font-family:Anton; font-size:40px; letter-spacing:.01em; line-height:1; }
  .mast small { font-weight:700; font-size:14px; text-transform:uppercase; }
  .strip { background:var(--black); color:var(--yellow); font-weight:900; font-size:16px; text-transform:uppercase; padding:7px 16px; letter-spacing:.06em; }
  main { padding:18px 16px 16px; display:flex; flex-direction:column; flex:1; }
  .q { font-weight:700; font-size:23px; line-height:1.1; border-left:6px solid var(--red); padding-left:10px; }
  .excl { margin-top:22px; align-self:flex-start; background:var(--yellow); font-family:Anton; font-size:28px; padding:2px 10px; transform:rotate(-3deg); }
  .head { margin-top:10px; font-family:Anton; font-size:168px; line-height:.88; text-transform:uppercase; letter-spacing:-.01em; }
  .sub { margin-top:8px; font-family:Anton; font-size:34px; color:var(--red); text-transform:uppercase; }
  .others { margin-top:18px; border-top:3px solid var(--black); }
  .others p { display:flex; justify-content:space-between; font-weight:700; font-size:22px; padding:10px 0; border-bottom:1px solid #bbb; }
  .others b { font-family:Anton; font-weight:400; }
  .next { margin-top:auto; height:46px; background:var(--black); position:relative; }
  .next i { position:absolute; inset:0 36% 0 0; background:var(--red); }
  .next span { position:relative; display:grid; place-items:center; height:100%; color:#fff; font-family:Anton; font-size:22px; text-transform:uppercase; }
  .host { margin-top:10px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .host button { height:50px; border:3px solid var(--black); background:var(--paper); font-family:Anton; font-size:22px; text-transform:uppercase; }
  .host .p { background:var(--black); color:var(--paper); }
</style>
</head>
<body>
  <header class="mast"><h1>AMBIANCEUR</h1><small>Édition de ce soir · n°07</small></header>
  <div class="strip">Révélation · question d'un joueur</div>
  <main>
    <p class="q">Qui oublierait son propre anniversaire ?</p>
    <p class="excl">EXCLU</p>
    <p class="head">Léa !</p>
    <p class="sub">7 voix sur 12</p>
    <div class="others"><p>Max <b>3</b></p><p>Inès <b>2</b></p></div>
    <div class="next"><i></i><span>Suite dans 5 s</span></div>
    <div class="host"><button class="p">Suite</button><button>Pause</button><button>Arrêter</button></div>
  </main>
</body>
</html>
